name: Docker CI

on: [pull_request]

permissions:
  contents: read

jobs:
  check-npm-ci-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: cp .env.example .env.dev

      - name: Build Docker Development Environment
        run: make dev-up-nostart
