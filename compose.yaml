services:
  discord-translator:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-translator:core
    container_name: discord-translator
    volumes:
      - ./db:/app/db
    environment:
      GOOGLE_CREDENTIAL: /run/secrets/google_credential
    secrets:
      - google_credential

secrets:
  google_credential:
    file: ${GOOGLE_CREDENTIAL}
